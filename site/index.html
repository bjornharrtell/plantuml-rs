<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plantuml-rs playground</title>
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#667; --line:#d0d7de; --panel:#f6f8fa; --err:#b42318; --accent:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --panel:#161b22; --err:#ff7b72; --accent:#58a6ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .grow { flex: 1; }
  select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  a { color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: minmax(280px, 40%) 1fr; min-height: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; } }
  #editor { width: 100%; height: 100%; border: 0; border-right: 1px solid var(--line); padding: 12px 16px; resize: none; outline: none;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); tab-size: 2; }
  #preview { overflow: auto; padding: 16px; background: #fff; min-height: 0; }
  #preview svg { max-width: none; display: block; margin: 0 auto; }
  #status { padding: 4px 12px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; display: flex; gap: 16px; white-space: pre-wrap; }
  #status.err { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>plantuml-rs</h1>
  <label>Example <select id="samples"></select></label>
  <button id="download">Download SVG</button>
  <span class="grow"></span>
  <span class="grow"></span>
  <span title="Diagram types the port renders so far">supported: sequence, class, object, state, activity, component, use case, C4, chen, packet, chart, mindmap, wbs, gantt, timing, salt, json, yaml, hcl, ebnf, crash</span>
  <a href="https://marketplace.visualstudio.com/items?itemName=bjornharrtell.plantuml-rs">VS Code extension</a>
  <a href="https://github.com/bjornharrtell/plantuml-rs">source</a>
</header>
<main>
  <textarea id="editor" spellcheck="false" aria-label="PlantUML source"></textarea>
  <div id="preview" aria-live="polite"></div>
</main>
<div id="status"><span id="msg">loading…</span><span>port of PlantUML 1.2026.10beta1 (upstream commit e6c3adc, 2026-10-24)</span><span id="info"></span></div>
<script type="module">
import init, { render, init_logging } from './pkg/plantuml_wasm.js';

const SAMPLES = {
  'Sequence: basics': `@startuml
Alice -> Bob: Authentication Request
Bob --> Alice: Authentication Response
Alice -> Alice: self message
note right of Bob: a note
@enduml`,
  'Sequence: groups, activation': `@startuml
actor User
participant API
database DB
User -> API: request
activate API
alt cache hit
  API --> User: cached
else miss
  API -> DB: query
  DB --> API: rows
  API --> User: response
end
deactivate API
ref over User, API : see other diagram
@enduml`,
  'Sequence: boxes, dividers, delay': `@startuml
box "Internal" #LightBlue
participant A
participant B
end box
== Init ==
A -> B: hello
...
B -> A: later
[-> A: from the border
@enduml`,
  'Preprocessor': `@startuml
!$names = ["Alice", "Bob", "Carol"]
!function $greet($n)
!return "hello " + $n
!endfunction
!foreach $n in $names
participant $n
!endfor
Alice -> Bob: $greet("Bob")
Bob -> Carol: $greet("Carol")
@enduml`,
  'Class': `@startuml
class Animal {
  -name : String
  +eat()
}
interface Pet
class Dog
Animal <|-- Dog
Pet <|.. Dog : implements
Dog --> Animal : owner
@enduml`,
  'Object': `@startuml
object "Alice" as alice {
  name = "Alice"
  age = 34
}
object "Bob" as bob {
  name = "Bob"
}
alice --> bob : knows
@enduml`,
  'Component': `@startuml
component "Web UI" as web
component "REST API" as api
database "PostgreSQL" as db
web --> api : HTTPS
api --> db : SQL
@enduml`,
  'Use case': `@startuml
left to right direction
actor Customer
usecase "Place order" as place
usecase "Pay" as pay
Customer --> place
place ..> pay : include
@enduml`,
  'C4 container': `@startuml
!include <C4/C4_Container>
title Internet banking
Person(customer, "Customer", "A customer of the bank")
System(banking, "Internet Banking System", "Shows balances and payments")
System_Boundary(internal, "Bank") {
  Container(api, "API", "Rust", "Serves requests")
  ContainerDb(db, "Database", "PostgreSQL", "Stores accounts")
}
Rel(customer, banking, "Uses")
Rel(banking, api, "Calls")
Rel(api, db, "Reads")
@enduml`,
  'Chen EER': `@startchen
entity DIRECTOR {
  Number <<key>>
  Name {
    Fname
    Lname
  }
  Born : DATE
}
entity MOVIE {
  Code
}
relationship RENTED_TO {
  Date
}
RENTED_TO -1- DIRECTOR
RENTED_TO -N- MOVIE
@endchen`,
  'State': `@startuml
[*] --> Idle
Idle --> Running : start
Running --> Paused : pause
Paused --> Running : resume
Running --> Done : finish
Done --> [*]
state Running {
  [*] --> Working
  Working --> Waiting : wait
  Waiting --> Working : ready
}
@enduml`,
  'Activity: control flow': `@startuml
start
:Receive order;
if (in stock?) then (yes)
  :Reserve item;
else (no)
  :Back-order;
endif
while (more items?)
  :Pack item;
endwhile
fork
  :Print label;
fork again
  :Send email;
end fork
stop
@enduml`,
  'Mindmap': `@startmindmap
* Project
** Plan
*** Scope
*** Budget
** Build
*** Code
*** Test
left side
** Ship
@endmindmap`,
  'WBS': `@startwbs
* Release
** Build
*** Compile
*** Package
** Test
*** Unit
*** Integration
@endwbs`,
  'Gantt': `@startgantt
Project starts 2020-07-01
[Specification] lasts 10 days
[Prototype] lasts 5 days
[Prototype] starts at [Specification]'s end
[Testing] lasts 5 days
[Testing] starts at [Prototype]'s end
[Specification] -> [Prototype]
[Prototype] -> [Testing]
[Prototype] is colored in LightBlue/Blue
[Testing] is 40% completed
@endgantt`,
  'Timing': `@startuml
concise "Client" as C
concise "Server" as S
@0
C is Idle
S is Idle
@10
C is Request
C -> S : request
@20
S is Busy
@40
S is Idle
S -> C : response
@50
C is Idle
@enduml`,
  'Salt': `@startsalt
{
  Login    | "admin   "
  Password | "****    "
  [Cancel] | [  OK  ]
}
@endsalt`,
  'JSON': `@startjson
{
  "name": "plantuml-rs",
  "tags": ["uml", "wasm"],
  "port": {"done": true, "types": 9}
}
@endjson`,
  'YAML': `@startyaml
name: plantuml-rs
tags:
  - uml
  - wasm
port:
  done: true
@endyaml`,
  'HCL': `@starthcl
module "server" {
  size  = "t3.micro"
  count = 2
  tags = {
    env = "prod"
  }
}
@endhcl`,
  'Chart': `@startchart
h-axis [1, 2, 3]
stackMode grouped
bar [10, , 30]
bar [5, 6, ]
@endchart`,
  'Packet': `@startpacketdiag
colwidth = 32
0-15: Source Port
16-31: Destination Port
32-63: Sequence Number
64-95: Acknowledgment Number
96-99: Data Offset
100-105: Reserved
106-111: Flags
@endpacketdiag`,
  'EBNF': `@startebnf
title Simple grammar
letter = "a" | "b" | "c" ;
digit = "0" | "1" ;
word = { letter } ;
number = digit , { digit } ;
name = [ "_" ] , word ;
@endebnf`,
  'Crash test': `@startcrash
This is working
@endcrash`,
};

const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const msg = document.getElementById('msg');
const info = document.getElementById('info');
const status = document.getElementById('status');
const samples = document.getElementById('samples');

for (const name of Object.keys(SAMPLES)) samples.add(new Option(name, name));
samples.add(new Option('(custom)', ''), 0);

const toB64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)));

let ready = false;
let timer = 0;
let lastSvg = '';

function run() {
  if (!ready) return;
  const t0 = performance.now();
  try {
    lastSvg = render(editor.value);
    preview.innerHTML = lastSvg;
    status.classList.remove('err');
    msg.textContent = 'ok';
    info.textContent = `${(performance.now() - t0).toFixed(0)} ms · ${(lastSvg.length / 1024).toFixed(1)} kB`;
  } catch (e) {
    status.classList.add('err');
    msg.textContent = String(e && e.message ? e.message : e);
    info.textContent = '';
  }
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    try { history.replaceState(null, '', '#' + toB64(editor.value)); } catch {}
    run();
  }, 250);
}

editor.addEventListener('input', () => { samples.value = ''; schedule(); });
editor.addEventListener('keydown', (ev) => {
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const { selectionStart: s, selectionEnd: e } = editor;
    editor.setRangeText('  ', s, e, 'end');
    editor.dispatchEvent(new Event('input'));
  }
});
samples.addEventListener('change', () => {
  if (samples.value) { editor.value = SAMPLES[samples.value]; schedule(); }
});
document.getElementById('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([lastSvg], { type: 'image/svg+xml' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'diagram.svg' });
  a.click();
  URL.revokeObjectURL(url);
});

const first = Object.keys(SAMPLES)[0];
try {
  editor.value = location.hash.length > 1 ? fromB64(location.hash.slice(1)) : SAMPLES[first];
  samples.value = location.hash.length > 1 ? '' : first;
} catch {
  editor.value = SAMPLES[first];
  samples.value = first;
}

try {
  await init();
  init_logging();
  ready = true;
  fetch('./pkg/version.txt').then((r) => (r.ok ? r.text() : '')).then((v) => { if (v) document.title += ' · ' + v.trim(); }).catch(() => {});
  run();
} catch (e) {
  status.classList.add('err');
  msg.textContent = 'failed to load the wasm module: ' + e;
}
</script>
</body>
</html>
