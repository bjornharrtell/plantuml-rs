name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      # the playground can browse the PlantUML test corpus the fidelity numbers come from
      - run: |
          git clone --quiet --filter=blob:none --sparse https://github.com/plantuml/plantuml ../plantuml
          git -C ../plantuml sparse-checkout set src/test/resources/vega
          git -C ../plantuml checkout --quiet e6c3adc2be7a50daa5f04b2b0f9d24928aa08efa
      - run: ./scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
