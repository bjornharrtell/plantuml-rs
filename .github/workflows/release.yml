name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted publishing: the crates.io token is exchanged for a short-lived one through OIDC.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the workspace version
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${version}"
            exit 1
          fi
          echo "releasing ${version}"

      - name: Tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD \
            || { echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }

      - name: Tests
        run: cargo test --workspace

      # crates.io trusted publishing: exchanges the workflow's OIDC identity for a token that is valid
      # for a few minutes, so no long-lived CARGO_REGISTRY_TOKEN secret is needed.
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth

      - name: Publish plantuml-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          crate=plantuml-core
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == '$crate'))")
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: plantuml-rs-release-workflow' \
            "https://crates.io/api/v1/crates/$crate/$version")
          if [ "$status" = "200" ]; then
            echo "$crate $version is already published, skipping"
            exit 0
          fi
          cargo publish -p "$crate"

      - name: Publish plantuml-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          crate=plantuml-cli
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == '$crate'))")
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: plantuml-rs-release-workflow' \
            "https://crates.io/api/v1/crates/$crate/$version")
          if [ "$status" = "200" ]; then
            echo "$crate $version is already published, skipping"
            exit 0
          fi
          # The registry index needs a moment before plantuml-core resolves as a dependency.
          for attempt in $(seq 1 20); do
            if cargo publish --dry-run -p "$crate" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for plantuml-core to appear in the index (attempt $attempt)"
            sleep 15
          done
          cargo publish -p "$crate"

  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, ext: '', archive: tar.gz }
          - { os: macos-15-intel, name: macos-x64, ext: '', archive: tar.gz }
          - { os: macos-14, name: macos-arm64, ext: '', archive: tar.gz }
          - { os: windows-latest, name: windows-x64, ext: '.exe', archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match ${version}"; exit 1; }

      - name: Build
        shell: bash
        run: cargo build --release -p plantuml-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="plantuml-cli-${version}-${{ matrix.name }}"
          mkdir -p "dist/$stage"
          cp "target/release/plantuml-cli${{ matrix.ext }}" "dist/$stage/"
          cp LICENSE README.md "dist/$stage/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "$stage.zip" "$stage" >/dev/null)
          else
            tar -czf "dist/$stage.tar.gz" -C dist "$stage"
          fi
          rm -rf "dist/$stage"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [crates, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { show = 1; next }
            show && /^## / { exit }
            show { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release ${version}." > notes.md; fi
          cat notes.md

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
