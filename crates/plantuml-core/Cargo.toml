[package]
name = "plantuml-core"
description = "PlantUML diagram rendering core (no I/O, wasm-compatible)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/plantuml-core"
keywords = ["plantuml", "uml", "svg", "diagram", "wasm"]
categories = ["visualization", "rendering", "wasm"]

[dependencies]
fancy-regex = "0.20.0"
graphviz-pure = "=0.2.3"
md-5 = "0.10.6"
log.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "perf"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

