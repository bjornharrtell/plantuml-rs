[workspace]
resolver = "2"
members = ["crates/plantuml-core", "crates/plantuml-cli", "crates/plantuml-wasm"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bjornharrtell/plantuml-rs"

[workspace.dependencies]
log = "0.4"
plantuml-core = { path = "crates/plantuml-core", version = "0.4.0" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Size-optimised build for wasm (opt-level "z" costs ~30% native speed).
[profile.wasm]
inherits = "release"
opt-level = "z"
